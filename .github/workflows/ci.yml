name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # CI_RUNS_ON is set by ci-route on the laptop: its runners when online, GitHub-hosted otherwise.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run check
      - run: npx playwright test
      # Sync and reminders, against the Worker under wrangler dev.
      - run: npm run test:server
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: echo "Ran on **${RUNNER_NAME}** (${RUNNER_ENVIRONMENT})" >> "$GITHUB_STEP_SUMMARY"
